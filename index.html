<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC3 Stock Suite</title>
    <style>
        :root {
            --bg-color: #071c16;
            --card-bg: #10281f;
            --card-bg-hover: #163629;
            --sidebar-bg: #04140f;
            --text-main: #f8fafc;
            --text-muted: #9fb8ac;
            --border-color: #1f3d30;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --emerald: #10b981;
            --emerald-dark: #059669;
            --emerald-light: #34d399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; }

        /* ===== Экран входа (glassmorphism, стиль Apple) ===== */
        .login-screen {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: center; padding: 24px;
            background:
                radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.25), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(5, 150, 105, 0.3), transparent 50%),
                linear-gradient(160deg, #04140f 0%, #071c16 40%, #0a1f1a 100%);
            overflow: hidden;
        }
        .login-screen.hidden { display: none; }
        .login-screen::before {
            content: ""; position: absolute; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.18), transparent 70%);
            top: -200px; left: -150px; filter: blur(10px); pointer-events: none;
        }
        .login-screen::after {
            content: ""; position: absolute; width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15), transparent 70%);
            bottom: -180px; right: -120px; filter: blur(10px); pointer-events: none;
        }
        .login-card {
            position: relative; width: 380px; max-width: 100%; padding: 40px 32px 32px; border-radius: 28px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            text-align: center;
        }
        .login-title {
            font-size: 30px; font-weight: 800; letter-spacing: -1px; margin-bottom: 4px;
            background: linear-gradient(135deg, var(--emerald-light), var(--emerald));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .login-logo {
            display: block; width: 100%; max-width: 220px; height: auto; margin: 2px auto 22px;
            filter: drop-shadow(0 4px 14px rgba(16, 185, 129, 0.35));
            pointer-events: none; -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; user-select: none;
        }
        .login-hint { font-size: 12px; color: rgba(226, 232, 240, 0.55); margin-bottom: 26px; }
        .login-field { text-align: left; margin-bottom: 16px; }
        .login-field label {
            display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
            color: rgba(226, 232, 240, 0.6); margin-bottom: 6px;
        }
        .login-input-wrap { position: relative; }
        .login-field input {
            width: 100%; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px; padding: 13px 14px; color: var(--text-main); font-size: 15px; outline: none;
            letter-spacing: 1px; transition: border-color 0.2s ease, background 0.2s ease;
        }
        .login-field input:focus { border-color: var(--emerald); background: rgba(255, 255, 255, 0.09); }
        .login-field input::placeholder { letter-spacing: normal; color: rgba(226, 232, 240, 0.35); }
        .login-toggle-pin {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none;
            color: rgba(226, 232, 240, 0.5); cursor: pointer; font-size: 12px; font-weight: 600; padding: 4px 6px;
        }
        .login-toggle-pin:hover { color: var(--emerald-light); }
        .login-btn {
            width: 100%; margin-top: 8px; padding: 14px; border: none; border-radius: 12px; font-size: 15px;
            font-weight: 700; color: #052e21; cursor: pointer;
            background: linear-gradient(135deg, var(--emerald-light), var(--emerald-dark));
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35); transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(16, 185, 129, 0.45); }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled { opacity: 0.6; cursor: default; transform: none; }
        .login-remember { display: flex; align-items: center; gap: 8px; margin: 14px 2px 2px; font-size: 12px; color: rgba(226, 232, 240, 0.6); }
        .login-remember input { accent-color: var(--emerald); width: 14px; height: 14px; }
        .login-error { min-height: 18px; margin-top: 14px; font-size: 12px; color: #fca5a5; }

        /* ===== Общие элементы (кнопки, модалки) ===== */
        .btn { border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; cursor: pointer; font-size: 14px; transition: background 0.15s ease; }
        .btn-add { background: linear-gradient(135deg, var(--emerald-light), var(--emerald-dark)); color: #052e21; }
        .btn-add:hover { filter: brightness(1.08); }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-secondary:hover { border-color: var(--emerald); color: var(--emerald-light); }
        .btn-danger { background: transparent; color: var(--danger-color); border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
        .btn-icon { padding: 6px 10px; font-size: 13px; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; width: 400px; max-width: 90vw; }
        .modal h2 { font-size: 18px; margin-bottom: 16px; color: var(--emerald-light); }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .field input, .field select {
            width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px;
            padding: 10px 12px; color: var(--text-main); font-size: 14px; outline: none;
        }
        .field input:focus, .field select:focus { border-color: var(--emerald); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .save-indicator { font-size: 12px; color: var(--text-muted); margin-top: 10px; min-height: 16px; }

        .history-list { max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .history-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; }
        .history-message { font-size: 13px; color: var(--text-main); margin-bottom: 4px; }
        .history-meta { font-size: 11px; color: var(--text-muted); }
        .empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); }

        /* ===== Каркас приложения: шторка + основная область ===== */
        #app-content { display: none; }
        .app-shell { display: flex; min-height: 100vh; }

        .sidebar {
            width: 240px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; transition: width 0.2s ease; overflow: hidden;
        }
        .sidebar.collapsed { width: 64px; }

        .sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px; border-bottom: 1px solid var(--border-color); }
        .sidebar-logo {
            font-size: 20px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap;
            background: linear-gradient(135deg, var(--emerald-light), var(--emerald)); -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .sidebar.collapsed .sidebar-logo { display: none; }
        .sidebar-toggle { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; }
        .sidebar-toggle:hover { color: var(--emerald-light); }

        .sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 12px; }
        .nav-group { margin-bottom: 22px; }
        .nav-group-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.9px; color: var(--text-muted); padding: 0 10px; margin-bottom: 10px; white-space: nowrap; }
        .sidebar.collapsed .nav-group-title { display: none; }

        .nav-item {
            display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none; text-align: left;
            color: #d5e6de; padding: 11px 12px; border-radius: 8px; cursor: pointer; font-size: 15px;
            font-weight: 600; margin-bottom: 3px; border-left: 3px solid transparent; white-space: nowrap;
        }
        .nav-item .nav-icon { font-size: 17px; width: 20px; text-align: center; flex-shrink: 0; }
        .nav-item span.nav-label { overflow: hidden; }
        .sidebar.collapsed .nav-item span.nav-label { display: none; }
        .nav-item:hover { background: rgba(255,255,255,0.06); color: var(--text-main); }
        .nav-item.active { background: rgba(16, 185, 129, 0.16); color: var(--emerald-light); border-left-color: var(--emerald); font-weight: 700; }

        .sidebar-warehouses { padding: 14px 12px; border-top: 1px solid var(--border-color); }
        .warehouse-row { display: flex; gap: 6px; }
        .sidebar.collapsed .warehouse-row { flex-direction: column; }
        .warehouse-btn {
            flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 8px 6px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700;
        }
        .warehouse-btn:hover { border-color: var(--emerald); }
        .warehouse-btn.active { background: var(--emerald); border-color: var(--emerald); color: #052e21; }

        .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        .topbar {
            display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 14px 24px;
            border-bottom: 1px solid var(--border-color); flex-wrap: wrap;
        }
        .lang-select {
            background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; outline: none;
        }
        .lang-select:focus { border-color: var(--emerald); }

        .page-container { padding: 28px; max-width: 1200px; margin: 0 auto; width: 100%; }

        /* ===== Главная страница ===== */
        .home-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
        .home-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .home-status { font-size: 12px; font-weight: 700; color: var(--emerald-light); background: rgba(16,185,129,0.12); padding: 3px 10px; border-radius: 20px; }
        .home-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

        .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 32px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px; }
        .stat-card .num { font-size: 20px; font-weight: 800; color: var(--emerald-light); }
        .stat-card .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 14px; }

        .module-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 8px; }
        @media (max-width: 900px) { .module-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
        @media (max-width: 520px) { .module-grid { grid-template-columns: 1fr; } }

        .module-tile {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 22px; cursor: pointer; transition: all 0.15s ease; text-align: left;
        }
        .module-tile:hover { border-color: var(--emerald); background: var(--card-bg-hover); transform: translateY(-2px); }
        .module-tile .icon { font-size: 28px; margin-bottom: 12px; display: block; }
        .module-tile .label { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .module-tile .desc { font-size: 12px; color: var(--text-muted); }

        /* ===== Страницы-заглушки ===== */
        .back-link {
            display: inline-flex; align-items: center; gap: 6px; color: var(--emerald); background: none;
            border: none; cursor: pointer; font-size: 13px; font-weight: 600; margin-bottom: 20px; padding: 0;
        }
        .back-link:hover { color: var(--emerald-light); }
        .placeholder-page {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 60px 32px; text-align: center;
        }
        .placeholder-page .picon { font-size: 40px; margin-bottom: 16px; }
        .placeholder-page h2 { font-size: 20px; margin-bottom: 10px; color: var(--emerald-light); }
        .placeholder-page p { font-size: 14px; color: var(--text-muted); max-width: 460px; margin: 0 auto; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div class="login-screen" id="login-screen">
        <div class="login-card">
            <div class="login-title">DC3</div>
            <img class="login-logo" src="logo.png" alt="Kletka Online" draggable="false" oncontextmenu="return false;">
            <div class="login-hint">ID та PIN-код</div>

            <div class="login-field">
                <label>ID</label>
                <input type="text" id="login-id" inputmode="numeric" autocomplete="username" placeholder="Введите ID" maxlength="12">
            </div>
            <div class="login-field">
                <label>PIN</label>
                <div class="login-input-wrap">
                    <input type="password" id="login-pin" inputmode="numeric" autocomplete="current-password" placeholder="••••" maxlength="8">
                    <button type="button" class="login-toggle-pin" id="login-toggle-pin">Показать</button>
                </div>
            </div>

            <label class="login-remember">
                <input type="checkbox" id="login-remember" checked>
                Запомнить меня на этом устройстве
            </label>

            <button class="login-btn" id="login-btn">Увійти</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>

    <div id="app-content">
        <div class="app-shell">

            <!-- ШТОРКА -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-top">
                    <div class="sidebar-logo">DC3</div>
                    <button class="sidebar-toggle" id="sidebar-toggle-btn" title="Свернуть/развернуть">☰</button>
                </div>

                <nav class="sidebar-nav">
                    <div class="nav-group">
                        <div class="nav-group-title" data-i18n="grp_main">Главное</div>
                        <button class="nav-item active" data-key="home" onclick="window.showHome()">
                            <span class="nav-icon">🏠</span><span class="nav-label" data-i18n="nav_home">Главная страница</span>
                        </button>
                        <button class="nav-item" data-key="material-master" onclick="window.openPage('material-master')">
                            <span class="nav-icon">📦</span><span class="nav-label" data-i18n="nav_material">Material Master</span>
                        </button>
                        <button class="nav-item" data-key="regions" onclick="window.openPage('regions')">
                            <span class="nav-icon">🗺️</span><span class="nav-label" data-i18n="nav_regions">Регионы и склады</span>
                        </button>
                        <button class="nav-item" data-key="search" onclick="window.openPage('search')">
                            <span class="nav-icon">🔍</span><span class="nav-label" data-i18n="nav_search">Поиск товара</span>
                        </button>
                    </div>

                    <div class="nav-group">
                        <div class="nav-group-title" data-i18n="grp_delivery">Delivery</div>
                        <button class="nav-item" data-key="delivery-calendar" onclick="window.openPage('delivery-calendar')">
                            <span class="nav-icon">📅</span><span class="nav-label" data-i18n="nav_calendar">Календарь</span>
                        </button>
                        <button class="nav-item" data-key="delivery-receive" onclick="window.openPage('delivery-receive')">
                            <span class="nav-icon">📥</span><span class="nav-label" data-i18n="nav_receive">Прием</span>
                        </button>
                        <button class="nav-item" data-key="delivery-issue" onclick="window.openPage('delivery-issue')">
                            <span class="nav-icon">📤</span><span class="nav-label" data-i18n="nav_issue">Выдача</span>
                        </button>
                        <button class="nav-item" data-key="po-pr" onclick="window.openPage('po-pr')">
                            <span class="nav-icon">📄</span><span class="nav-label" data-i18n="nav_popr">PO/PR</span>
                        </button>
                    </div>

                    <div class="nav-group">
                        <div class="nav-group-title" data-i18n="grp_outbound">Pending outbound</div>
                        <button class="nav-item" data-key="transfer-in" onclick="window.openPage('transfer-in')">
                            <span class="nav-icon">⬇️</span><span class="nav-label" data-i18n="nav_transfer_in">Трансфер прием</span>
                        </button>
                        <button class="nav-item" data-key="transfer-out" onclick="window.openPage('transfer-out')">
                            <span class="nav-icon">⬆️</span><span class="nav-label" data-i18n="nav_transfer_out">Трансфер отправка</span>
                        </button>
                    </div>
                </nav>

                <div class="sidebar-warehouses">
                    <div class="nav-group-title" data-i18n="grp_warehouse">Склад</div>
                    <div class="warehouse-row" id="warehouse-row">
                        <button class="warehouse-btn active" data-wh="DC1" onclick="window.selectWarehouse('DC1')">DC1</button>
                        <button class="warehouse-btn" data-wh="DC2" onclick="window.selectWarehouse('DC2')">DC2</button>
                        <button class="warehouse-btn" data-wh="DC3" onclick="window.selectWarehouse('DC3')">DC3</button>
                    </div>
                </div>
            </aside>

            <!-- ОСНОВНАЯ ОБЛАСТЬ -->
            <div class="main-area">
                <div class="topbar">
                    <select class="lang-select" id="lang-select" onchange="window.setLanguage(this.value)">
                        <option value="ru">RU — Русский</option>
                        <option value="uk">UA — Українська</option>
                        <option value="pl">PL — Polski</option>
                        <option value="en">EN — English</option>
                    </select>
                    <button class="btn btn-secondary btn-icon" onclick="window.openAddEmployeeModal()" style="display:none;" id="add-emp-nav-btn">+ Сотрудник</button>
                    <button class="btn btn-secondary btn-icon" onclick="window.logout()" id="logout-btn">
                        <span id="current-user-name"></span> <span data-i18n="btn_logout">Выйти</span>
                    </button>
                </div>

                <!-- ГЛАВНАЯ СТРАНИЦА -->
                <div class="page-container" id="home-view">
                    <div class="home-header">
                        <h1 id="home-warehouse-title">Склад DC1</h1>
                        <span class="home-status" data-i18n="status_active">Активен</span>
                    </div>
                    <div class="home-sub" data-i18n="home_sub">Импорт из Excel, поставки, перемещения и заказы — всё в одном месте</div>

                    <div class="stat-row" id="stat-row"></div>

                    <div class="section-title" data-i18n="modules_title">Модули системы</div>
                    <div class="module-grid" id="module-grid"></div>
                </div>

                <!-- СТРАНИЦЫ-ЗАГЛУШКИ -->
                <div class="page-container" id="page-view" style="display:none;"></div>
            </div>
        </div>
    </div><!-- /app-content -->

    <!-- Modal for adding employee -->
    <div class="modal-overlay" id="add-employee-overlay">
        <div class="modal">
            <h2>Добавить сотрудника</h2>
            <div class="field">
                <label>ID (логин)</label>
                <input type="text" id="new-emp-id" inputmode="numeric" placeholder="Например: 60127940" maxlength="12">
            </div>
            <div class="field">
                <label>PIN</label>
                <input type="text" id="new-emp-pin" inputmode="numeric" placeholder="Не короче 6 цифр" maxlength="8">
            </div>
            <div class="field">
                <label>Имя сотрудника</label>
                <input type="text" id="new-emp-name" placeholder="Например: Иван Иванов">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="window.closeAddEmployeeModal()">Отмена</button>
                <button class="btn btn-add" onclick="window.addEmployee()" id="add-emp-btn">Добавить</button>
            </div>
            <div class="save-indicator" id="add-emp-error" style="color:#fca5a5;"></div>
        </div>
    </div>

    <!-- Modal for history log -->
    <div class="modal-overlay" id="history-overlay">
        <div class="modal" style="width: 480px; max-width: 92vw;">
            <h2>История действий</h2>
            <div id="history-list" class="history-list"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="window.closeHistoryModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getFirestore, collection, onSnapshot,
            addDoc, updateDoc, deleteDoc, doc, getDoc, setDoc,
            query, orderBy, limit
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import {
            getAuth, onAuthStateChanged, signInWithEmailAndPassword,
            createUserWithEmailAndPassword, signOut,
            setPersistence, browserLocalPersistence, browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuBuZSiOi7A_Y7aMhXz2_MEVo48fOlu08",
            authDomain: "kletka-online.firebaseapp.com",
            projectId: "kletka-online",
            storageBucket: "kletka-online.firebasestorage.app",
            messagingSenderId: "641272379713",
            appId: "1:641272379713:web:34074267d0708ff80809c0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const employeesCollection = collection(db, 'employees');
        const activityCollection = collection(db, 'activity_log');

        let currentUserName = '';
        let isAdmin = false;
        let currentWarehouse = 'DC1';
        let currentLang = 'ru';

        async function logActivity(action, message) {
            try {
                await addDoc(activityCollection, { action, message, actor: currentUserName || 'Неизвестно', timestamp: Date.now() });
            } catch (e) { console.error('Activity log error:', e); }
        }

        function escapeHtml(str) { const div = document.createElement('div'); div.innerText = str; return div.innerHTML; }

        // ID/PIN превращаем в email/пароль для настоящей Firebase-авторизации —
        // человек по-прежнему вводит только ID и PIN, а под капотом это полноценный аккаунт
        function idToEmail(id) { return `${id}@kletka-online.app`; }
        function pinToPassword(pin) { return `klt-${pin}-secure`; }

        const BOOTSTRAP_ID = '60127939';
        const BOOTSTRAP_PIN = '6242';
        const BOOTSTRAP_NAME = 'Александр';

        // ===== Экран входа =====
        const ATTEMPTS_KEY = 'kletka_login_attempts';
        const LOCK_UNTIL_KEY = 'kletka_login_lock_until';
        const MAX_ATTEMPTS = 5;
        const LOCK_DURATION_MS = 60 * 1000;

        function showApp(userName) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('current-user-name').innerText = userName ? userName + ' —' : '';
        }
        function showLoginScreen() {
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }
        function showLoginError(msg) { document.getElementById('login-error').innerText = msg; }
        function getLockRemainingMs() { return Math.max(0, parseInt(localStorage.getItem(LOCK_UNTIL_KEY) || '0', 10) - Date.now()); }
        function registerFailedAttempt() {
            const attempts = parseInt(localStorage.getItem(ATTEMPTS_KEY) || '0', 10) + 1;
            localStorage.setItem(ATTEMPTS_KEY, String(attempts));
            if (attempts >= MAX_ATTEMPTS) {
                localStorage.setItem(LOCK_UNTIL_KEY, String(Date.now() + LOCK_DURATION_MS));
                localStorage.setItem(ATTEMPTS_KEY, '0');
            }
            return attempts;
        }
        function clearAttempts() { localStorage.removeItem(ATTEMPTS_KEY); localStorage.removeItem(LOCK_UNTIL_KEY); }

        let lockTimerInterval = null;
        function startLockCountdown() {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            if (lockTimerInterval) clearInterval(lockTimerInterval);
            lockTimerInterval = setInterval(() => {
                const remaining = getLockRemainingMs();
                if (remaining <= 0) {
                    clearInterval(lockTimerInterval);
                    btn.disabled = false; btn.innerText = 'Увійти'; showLoginError('');
                } else {
                    const seconds = Math.ceil(remaining / 1000);
                    showLoginError(`Занадто багато спроб. Спробуйте через ${seconds} с.`);
                    btn.innerText = `Заблоковано (${seconds}с)`;
                }
            }, 500);
        }

        async function attemptLogin() {
            if (getLockRemainingMs() > 0) { startLockCountdown(); return; }
            const idVal = document.getElementById('login-id').value.trim();
            const pinVal = document.getElementById('login-pin').value.trim();
            const btn = document.getElementById('login-btn');
            const remember = document.getElementById('login-remember').checked;
            if (!idVal || !pinVal) { showLoginError('Введіть ID та PIN'); return; }

            btn.disabled = true; btn.innerText = '...'; showLoginError('');
            try {
                await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
                try {
                    await signInWithEmailAndPassword(auth, idToEmail(idVal), pinToPassword(pinVal));
                    clearAttempts();
                } catch (signInErr) {
                    const isMissingUser = signInErr.code === 'auth/user-not-found' || signInErr.code === 'auth/invalid-credential';
                    if (isMissingUser && idVal === BOOTSTRAP_ID && pinVal === BOOTSTRAP_PIN) {
                        const cred = await createUserWithEmailAndPassword(auth, idToEmail(idVal), pinToPassword(pinVal));
                        await setDoc(doc(employeesCollection, cred.user.uid), { id: idVal, name: BOOTSTRAP_NAME, role: 'staff' });
                        clearAttempts();
                    } else { throw signInErr; }
                }
            } catch (err) {
                console.error('Auth error:', err.code || err);
                const attempts = registerFailedAttempt();
                if (getLockRemainingMs() > 0) { startLockCountdown(); }
                else {
                    showLoginError(`Невірний ID або PIN (спроба ${attempts}/${MAX_ATTEMPTS})`);
                    btn.disabled = false; btn.innerText = 'Увійти';
                }
            }
        }

        onAuthStateChanged(auth, async (user) => {
            const btn = document.getElementById('login-btn');
            if (user) {
                let name = '';
                isAdmin = false;
                try {
                    const empSnap = await getDoc(doc(employeesCollection, user.uid));
                    if (empSnap.exists()) { name = empSnap.data().name || ''; isAdmin = empSnap.data().role === 'admin'; }
                } catch (e) { console.error('Employee lookup error:', e); }
                currentUserName = name;
                document.getElementById('add-emp-nav-btn').style.display = isAdmin ? 'inline-block' : 'none';
                showApp(name);
                subscribeToActivity();
                showHome();
                applyLanguage();
            } else {
                showLoginScreen();
                unsubscribeFromActivity();
                currentUserName = ''; isAdmin = false;
            }
            btn.disabled = false; btn.innerText = 'Увійти';
        });

        // ===== Добавление сотрудника (через вторичный экземпляр Firebase,
        // чтобы не выбивало из системы текущего вошедшего) =====
        async function addEmployee() {
            if (!isAdmin) {
                document.getElementById('add-emp-error').innerText = 'Только администратор может добавлять сотрудников';
                return;
            }
            const newId = document.getElementById('new-emp-id').value.trim();
            const newPin = document.getElementById('new-emp-pin').value.trim();
            const newName = document.getElementById('new-emp-name').value.trim();
            const errorEl = document.getElementById('add-emp-error');
            const btn = document.getElementById('add-emp-btn');
            errorEl.innerText = '';

            if (!newId || !newPin || !newName) { errorEl.innerText = 'Заполните все поля'; return; }
            if (newPin.length < 6) { errorEl.innerText = 'PIN должен быть не короче 6 цифр'; return; }

            btn.disabled = true; btn.innerText = '...';
            const secondaryApp = initializeApp(firebaseConfig, 'secondary-' + Date.now());
            const secondaryAuth = getAuth(secondaryApp);
            const secondaryDb = getFirestore(secondaryApp);

            try {
                const cred = await createUserWithEmailAndPassword(secondaryAuth, idToEmail(newId), pinToPassword(newPin));
                await setDoc(doc(collection(secondaryDb, 'employees'), cred.user.uid), { id: newId, name: newName, role: 'staff' });
                await signOut(secondaryAuth);
                await deleteApp(secondaryApp);
                logActivity('employee', `Добавлен сотрудник: ${newName} (ID ${newId})`);
                closeAddEmployeeModal();
                document.getElementById('new-emp-id').value = '';
                document.getElementById('new-emp-pin').value = '';
                document.getElementById('new-emp-name').value = '';
            } catch (err) {
                console.error('Add employee error:', err);
                if (err.code === 'auth/email-already-in-use') errorEl.innerText = 'Сотрудник с таким ID уже существует';
                else if (err.code === 'auth/weak-password') errorEl.innerText = 'PIN слишком короткий (нужно от 6 символов)';
                else errorEl.innerText = 'Ошибка при добавлении';
                try { await deleteApp(secondaryApp); } catch (e) {}
            } finally {
                btn.disabled = false; btn.innerText = 'Добавить';
            }
        }
        function openAddEmployeeModal() {
            document.getElementById('add-emp-error').innerText = '';
            document.getElementById('add-employee-overlay').classList.add('open');
        }
        function closeAddEmployeeModal() { document.getElementById('add-employee-overlay').classList.remove('open'); }

        // ===== Журнал действий =====
        let unsubscribeActivity = null;
        function subscribeToActivity() {
            if (unsubscribeActivity) return;
            const q = query(activityCollection, orderBy('timestamp', 'desc'), limit(50));
            unsubscribeActivity = onSnapshot(q, (snapshot) => {
                const list = document.getElementById('history-list');
                if (!list) return;
                if (snapshot.empty) { list.innerHTML = `<div class="empty-state">Пока нет действий</div>`; return; }
                list.innerHTML = snapshot.docs.map(d => {
                    const data = d.data();
                    const dt = new Date(data.timestamp);
                    const timeStr = dt.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    return `<div class="history-item"><div class="history-message">${escapeHtml(data.message || '')}</div><div class="history-meta">${escapeHtml(data.actor || '')} · ${timeStr}</div></div>`;
                }).join('');
            }, (err) => console.error('Activity error:', err));
        }
        function unsubscribeFromActivity() { if (unsubscribeActivity) { unsubscribeActivity(); unsubscribeActivity = null; } }
