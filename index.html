<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kletka Online</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --status-kletka: #3b82f6;
            --status-issued: #eab308;
            --status-broken: #ef4444;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --emerald: #10b981;
            --emerald-dark: #059669;
            --emerald-light: #34d399;
        }

        /* ===== Экран входа (glassmorphism, стиль Apple) ===== */
        .login-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.25), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(5, 150, 105, 0.3), transparent 50%),
                linear-gradient(160deg, #04140f 0%, #071c16 40%, #0a1f1a 100%);
            overflow: hidden;
        }

        .login-screen.hidden { display: none; }

        .login-screen::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.18), transparent 70%);
            top: -200px;
            left: -150px;
            filter: blur(10px);
            pointer-events: none;
        }

        .login-screen::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15), transparent 70%);
            bottom: -180px;
            right: -120px;
            filter: blur(10px);
            pointer-events: none;
        }

        .login-card {
            position: relative;
            width: 380px;
            max-width: 100%;
            padding: 40px 32px 32px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            text-align: center;
        }

        .login-title {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--emerald-light), var(--emerald));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-logo {
            display: block;
            width: 100%;
            max-width: 220px;
            height: auto;
            margin: 2px auto 22px;
            filter: drop-shadow(0 4px 14px rgba(16, 185, 129, 0.35));
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        .login-subtitle {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .login-hint {
            font-size: 12px;
            color: rgba(226, 232, 240, 0.55);
            margin-bottom: 26px;
        }

        .login-field {
            text-align: left;
            margin-bottom: 16px;
        }

        .login-field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: rgba(226, 232, 240, 0.6);
            margin-bottom: 6px;
        }

        .login-input-wrap {
            position: relative;
        }

        .login-field input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            padding: 13px 14px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            letter-spacing: 1px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .login-field input:focus {
            border-color: var(--emerald);
            background: rgba(255, 255, 255, 0.09);
        }

        .login-field input::placeholder {
            letter-spacing: normal;
            color: rgba(226, 232, 240, 0.35);
        }

        .login-toggle-pin {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(226, 232, 240, 0.5);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 6px;
        }
        .login-toggle-pin:hover { color: var(--emerald-light); }

        .login-btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #052e21;
            cursor: pointer;
            background: linear-gradient(135deg, var(--emerald-light), var(--emerald-dark));
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(16, 185, 129, 0.45); }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled { opacity: 0.6; cursor: default; transform: none; }

        .login-remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 2px 2px;
            font-size: 12px;
            color: rgba(226, 232, 240, 0.6);
        }
        .login-remember input { accent-color: var(--emerald); width: 14px; height: 14px; }

        .login-error {
            min-height: 18px;
            margin-top: 14px;
            font-size: 12px;
            color: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand .sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .lang-switcher {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--accent-color);
            color: #ffffff;
        }

        .lang-btn:hover:not(.active) {
            color: var(--text-main);
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-input {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text-main);
            width: 300px;
            max-width: 100%;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s ease;
        }

        .btn-add {
            background: var(--accent-color);
            color: white;
        }
        .btn-add:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover { border-color: var(--text-muted); }

        .btn-danger {
            background: transparent;
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

        .btn-icon {
            padding: 6px 10px;
            font-size: 13px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .status-kletka { background: rgba(59, 130, 246, 0.15); color: var(--status-kletka); }
        .status-issued { background: rgba(234, 179, 8, 0.15); color: var(--status-issued); }
        .status-broken { background: rgba(239, 68, 68, 0.15); color: var(--status-broken); }

        select.status-badge option {
            background: var(--card-bg);
            color: var(--text-main);
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 400px;
            max-width: 90vw;
        }

        .modal h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field input, .field select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .field input:focus, .field select:focus {
            border-color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .save-indicator {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            min-height: 16px;
        }

        .history-list {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
        }

        .history-message {
            font-size: 13px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .history-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
        }
        /* ===== Dashboard: сводка и плитки категорий ===== */
        .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 28px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px; }
        .stat-card .num { font-size: 20px; font-weight: 800; color: var(--emerald); }
        .stat-card .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 14px; }

        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .category-tile {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 20px; cursor: pointer; transition: all 0.15s ease; text-align: left;
        }
        .category-tile:hover { border-color: var(--emerald); background: #24304a; transform: translateY(-2px); }
        .category-tile .icon { font-size: 26px; margin-bottom: 10px; display: block; }
        .category-tile .label { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .category-tile .count { font-size: 22px; font-weight: 800; color: var(--emerald); }
        .category-tile .count-label { font-size: 11px; color: var(--text-muted); }

        .back-link {
            display: inline-flex; align-items: center; gap: 6px; color: var(--emerald); background: none;
            border: none; cursor: pointer; font-size: 13px; font-weight: 600; margin-bottom: 16px; padding: 0;
        }
        .back-link:hover { color: var(--emerald-light); }

    </style>
</head>
<body>

    <!-- Экран входа -->
    <div class="login-screen" id="login-screen">
        <div class="login-card">
            <div class="login-title">DC3</div>
            <img class="login-logo" src="logo.png" alt="Kletka Online" draggable="false" oncontextmenu="return false;">
            <div class="login-hint">ID та PIN-код (4–6 цифр)</div>

            <div class="login-field">
                <label>ID</label>
                <input type="text" id="login-id" inputmode="numeric" autocomplete="username" placeholder="Введите ID" maxlength="12">
            </div>
            <div class="login-field">
                <label>PIN</label>
                <div class="login-input-wrap">
                    <input type="password" id="login-pin" inputmode="numeric" autocomplete="current-password" placeholder="••••" maxlength="6">
                    <button type="button" class="login-toggle-pin" id="login-toggle-pin">Показать</button>
                </div>
            </div>

            <label class="login-remember">
                <input type="checkbox" id="login-remember" checked>
                Запомнить меня на этом устройстве
            </label>

            <button class="login-btn" id="login-btn">Увійти</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>

    <div id="app-content" style="display:none; padding: 24px;">

    <header class="header">
        <div class="brand">
            <h1>Kletka Online</h1>
            <div class="sub" id="record-count"></div>
        </div>
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="ru" onclick="setLanguage('ru')">RU</button>
            <button class="lang-btn" data-lang="uk" onclick="setLanguage('uk')">UA</button>
            <button class="lang-btn" data-lang="pl" onclick="setLanguage('pl')">PL</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
        </div>
        <button class="btn btn-secondary btn-icon" onclick="window.openAddEmployeeModal()" style="margin-left:8px; display:none;" id="add-emp-nav-btn">+ Сотрудник</button>
        <button class="btn btn-secondary btn-icon" onclick="window.openHistoryModal()" style="margin-left:8px;">История</button>
        <button class="btn btn-secondary btn-icon" onclick="window.logout()" style="margin-left:8px;" id="logout-btn">
            <span id="current-user-name"></span> Выйти
        </button>
    </header>

    <!-- ГЛАВНАЯ: сводка и плитки категорий -->
    <div id="dashboard-view">
        <div class="stat-row" id="stat-row"></div>
        <div class="section-title">Категории</div>
        <div class="category-grid" id="category-grid"></div>
    </div>

    <!-- ВИД: Инструменты (Kletka) -->
    <div id="tools-view" style="display:none;">
        <button class="back-link" onclick="window.showDashboard()">← Все категории</button>

        <div class="controls-bar">
            <input type="text" class="search-input" id="search-input" placeholder="Поиск инструмента..." oninput="renderTable()">
            <button class="btn btn-add" id="btn-add" onclick="openAddModal()">+ Добавить запись</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th id="th-id">ID</th>
                        <th id="th-name">Наименование</th>
                        <th id="th-employee">Сотрудник</th>
                        <th id="th-status">Статус</th>
                        <th id="th-date">Дата записи</th>
                        <th id="th-actions"></th>
                    </tr>
                </thead>
                <tbody id="inventory-list">
                    <tr><td colspan="6" class="loading" id="loading-row">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ВИД: Техника (категории вроде "Мониторы") -->
    <div id="tech-view" style="display:none;">
        <button class="back-link" onclick="window.showDashboard()">← Все категории</button>

        <div class="controls-bar">
            <input type="text" class="search-input" id="tech-search-input" placeholder="Поиск по модели, серийному номеру, Asset code..." oninput="renderTechTable()">
            <button class="btn btn-add" onclick="window.openAddTechModal()">+ Добавить</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Asset Code</th>
                        <th>Название / модель</th>
                        <th>Серийный номер</th>
                        <th>Статус</th>
                        <th>Дата записи</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tech-items-list">
                    <tr><td colspan="6" class="loading">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for add/edit -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">Добавить запись</h2>
            <div class="field">
                <label id="lbl-name">Наименование</label>
                <input type="text" id="field-name" placeholder="Например: Перфоратор Bosch GBH 2-26">
            </div>
            <div class="field">
                <label id="lbl-employee">Сотрудник</label>
                <input type="text" id="field-employee" placeholder="ФИО сотрудника">
            </div>
            <div class="field">
                <label id="lbl-status">Статус</label>
                <select id="field-status">
                    <option value="kletka">В клетке</option>
                    <option value="issued">Выдано</option>
                    <option value="broken">Неисправно</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()" id="btn-cancel">Отмена</button>
                <button class="btn btn-add" onclick="saveRecord()" id="btn-save">Сохранить</button>
            </div>
            <div class="save-indicator" id="save-indicator"></div>
        </div>
    </div>

    <!-- Modal for adding employee -->
    <div class="modal-overlay" id="add-employee-overlay">
        <div class="modal">
            <h2>Добавить сотрудника</h2>
            <div class="field">
                <label>ID (логин)</label>
                <input type="text" id="new-emp-id" inputmode="numeric" placeholder="Например: 60127940" maxlength="12">
            </div>
            <div class="field">
                <label>PIN</label>
                <input type="text" id="new-emp-pin" inputmode="numeric" placeholder="Не короче 6 цифр" maxlength="8">
            </div>
            <div class="field">
                <label>Имя сотрудника</label>
                <input type="text" id="new-emp-name" placeholder="Например: Иван Иванов">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="window.closeAddEmployeeModal()">Отмена</button>
                <button class="btn btn-add" onclick="window.addEmployee()" id="add-emp-btn">Добавить</button>
            </div>
            <div class="save-indicator" id="add-emp-error" style="color:#fca5a5;"></div>
        </div>
    </div>

    <!-- Modal for history log -->
    <div class="modal-overlay" id="history-overlay">
        <div class="modal" style="width: 480px; max-width: 92vw;">
            <h2>История действий</h2>
            <div id="history-list" class="history-list"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="window.closeHistoryModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Modal for add/edit tech item -->
    <div class="modal-overlay" id="tech-modal-overlay">
        <div class="modal">
            <h2 id="tech-modal-title">Добавить технику</h2>
            <div class="field">
                <label>Название / модель</label>
                <input type="text" id="tech-field-name" placeholder="Например: Dell P2419H 24&quot;">
            </div>
            <div class="field">
                <label>Серийный номер</label>
                <input type="text" id="tech-field-serial" placeholder="S/N">
            </div>
            <div class="field">
                <label>Asset code</label>
                <input type="text" id="tech-field-asset" placeholder="Инвентарный код">
            </div>
            <div class="field">
                <label>Статус</label>
                <select id="tech-field-status">
                    <option value="kletka">В наличии</option>
                    <option value="issued">Выдано</option>
                    <option value="broken">Неисправно</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="window.closeTechModal()">Отмена</button>
                <button class="btn btn-add" onclick="window.saveTechItem()" id="tech-btn-save">Сохранить</button>
            </div>
            <div class="save-indicator" id="tech-save-indicator"></div>
        </div>
    </div>

    </div><!-- /app-content -->

    <script type="module">
        import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getFirestore, collection, onSnapshot,
            addDoc, updateDoc, deleteDoc, doc, getDoc, setDoc,
            query, orderBy, limit
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import {
            getAuth, onAuthStateChanged, signInWithEmailAndPassword,
            createUserWithEmailAndPassword, signOut,
            setPersistence, browserLocalPersistence, browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuBuZSiOi7A_Y7aMhXz2_MEVo48fOlu08",
            authDomain: "kletka-online.firebaseapp.com",
            projectId: "kletka-online",
            storageBucket: "kletka-online.firebasestorage.app",
            messagingSenderId: "641272379713",
            appId: "1:641272379713:web:34074267d0708ff80809c0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const recordsCollection = collection(db, 'records');
        const employeesCollection = collection(db, 'employees');
        const activityCollection = collection(db, 'activity_log');
        const techItemsCollection = collection(db, 'tech_items');

        // Категории техники — легко расширить позже, просто добавив новый объект в массив
        const TECH_CATEGORIES = [
            { key: 'monitors', label: 'Мониторы', icon: '🖥️', prefix: 'MON' }
        ];
        function techCategoryLabel(key) {
            const c = TECH_CATEGORIES.find(c => c.key === key);
            return c ? c.label : key;
        }

        let currentUserName = '';
        let isAdmin = false;
        let techItems = [];
        let currentTechCategory = null;
        let editingTechId = null;

        async function logActivity(action, message) {
            try {
                await addDoc(activityCollection, {
                    action,
                    message,
                    actor: currentUserName || 'Неизвестно',
                    timestamp: Date.now()
                });
            } catch (e) {
                console.error('Activity log error:', e);
            }
        }

        // ID/PIN превращаем в email/пароль для настоящей Firebase-авторизации —
        // человек по-прежнему вводит только ID и PIN, а под капотом это полноценный аккаунт
        function idToEmail(id) { return `${id}@kletka-online.app`; }
        function pinToPassword(pin) { return `klt-${pin}-secure`; }

        const BOOTSTRAP_ID = '60127939';
        const BOOTSTRAP_PIN = '6242';
        const BOOTSTRAP_NAME = 'Александр';

        // ===== Экран входа =====
        const ATTEMPTS_KEY = 'kletka_login_attempts';
        const LOCK_UNTIL_KEY = 'kletka_login_lock_until';
        const MAX_ATTEMPTS = 5;
        const LOCK_DURATION_MS = 60 * 1000; // 1 минута блокировки после превышения попыток

        function showApp(userName) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('current-user-name').innerText = userName ? userName + ' —' : '';
        }

        function showLoginScreen() {
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('dashboard-view').style.display = 'block';
            document.getElementById('tools-view').style.display = 'none';
            document.getElementById('tech-view').style.display = 'none';
            renderDashboard();
        }

        function openToolsView() {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('tools-view').style.display = 'block';
            document.getElementById('tech-view').style.display = 'none';
        }

        function openTechCategory(key) {
            currentTechCategory = key;
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('tools-view').style.display = 'none';
            document.getElementById('tech-view').style.display = 'block';
            document.getElementById('tech-search-input').value = '';
            renderTechTable();
        }

        function renderDashboard() {
            const statRow = document.getElementById('stat-row');
            const grid = document.getElementById('category-grid');
            if (!statRow || !grid) return;

            const allStatuses = [...records.map(r => r.status), ...techItems.map(i => i.status)];
            statRow.innerHTML = `
                <div class="stat-card"><div class="num">${records.length + techItems.length}</div><div class="lbl">Всего единиц</div></div>
                <div class="stat-card"><div class="num">${allStatuses.filter(s => s === 'kletka').length}</div><div class="lbl">В наличии</div></div>
                <div class="stat-card"><div class="num">${allStatuses.filter(s => s === 'issued').length}</div><div class="lbl">Выдано</div></div>
                <div class="stat-card"><div class="num">${allStatuses.filter(s => s === 'broken').length}</div><div class="lbl">Неисправно</div></div>
            `;

            const toolsTile = `
                <button class="category-tile" onclick="window.openToolsView()">
                    <span class="icon">🔧</span>
                    <div class="label">Инструменты</div>
                    <div class="count">${records.length}</div>
                    <div class="count-label">единиц</div>
                </button>
            `;
            const techTiles = TECH_CATEGORIES.map(cat => {
                const count = techItems.filter(i => i.category === cat.key).length;
                return `
                    <button class="category-tile" onclick="window.openTechCategory('${cat.key}')">
                        <span class="icon">${cat.icon}</span>
                        <div class="label">${cat.label}</div>
                        <div class="count">${count}</div>
                        <div class="count-label">единиц</div>
                    </button>
                `;
            }).join('');
            grid.innerHTML = toolsTile + techTiles;
        }

        function showLoginError(msg) {
            document.getElementById('login-error').innerText = msg;
        }

        function getLockRemainingMs() {
            const lockUntil = parseInt(localStorage.getItem(LOCK_UNTIL_KEY) || '0', 10);
            return Math.max(0, lockUntil - Date.now());
        }

        function registerFailedAttempt() {
            const attempts = parseInt(localStorage.getItem(ATTEMPTS_KEY) || '0', 10) + 1;
            localStorage.setItem(ATTEMPTS_KEY, String(attempts));
            if (attempts >= MAX_ATTEMPTS) {
                localStorage.setItem(LOCK_UNTIL_KEY, String(Date.now() + LOCK_DURATION_MS));
                localStorage.setItem(ATTEMPTS_KEY, '0');
            }
            return attempts;
        }

        function clearAttempts() {
            localStorage.removeItem(ATTEMPTS_KEY);
            localStorage.removeItem(LOCK_UNTIL_KEY);
        }

        let lockTimerInterval = null;
        function startLockCountdown() {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            if (lockTimerInterval) clearInterval(lockTimerInterval);
            lockTimerInterval = setInterval(() => {
                const remaining = getLockRemainingMs();
                if (remaining <= 0) {
                    clearInterval(lockTimerInterval);
                    btn.disabled = false;
                    btn.innerText = 'Увійти';
                    showLoginError('');
                } else {
                    const seconds = Math.ceil(remaining / 1000);
                    showLoginError(`Занадто багато спроб. Спробуйте через ${seconds} с.`);
                    btn.innerText = `Заблоковано (${seconds}с)`;
                }
            }, 500);
        }

        async function attemptLogin() {
            const remainingLock = getLockRemainingMs();
            if (remainingLock > 0) {
                startLockCountdown();
                return;
            }

            const idVal = document.getElementById('login-id').value.trim();
            const pinVal = document.getElementById('login-pin').value.trim();
            const btn = document.getElementById('login-btn');
            const remember = document.getElementById('login-remember').checked;

            if (!idVal || !pinVal) {
                showLoginError('Введіть ID та PIN');
                return;
            }

            btn.disabled = true;
            btn.innerText = '...';
            showLoginError('');

            try {
                await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);

                try {
                    await signInWithEmailAndPassword(auth, idToEmail(idVal), pinToPassword(pinVal));
                    clearAttempts();
                    // onAuthStateChanged сам покажет приложение и подтянет имя
                } catch (signInErr) {
                    const isMissingUser = signInErr.code === 'auth/user-not-found' || signInErr.code === 'auth/invalid-credential';
                    if (isMissingUser && idVal === BOOTSTRAP_ID && pinVal === BOOTSTRAP_PIN) {
                        // Самый первый запуск — создаём главный аккаунт-администратор
                        const cred = await createUserWithEmailAndPassword(auth, idToEmail(idVal), pinToPassword(pinVal));
                        await setDoc(doc(employeesCollection, cred.user.uid), { id: idVal, name: BOOTSTRAP_NAME, role: 'staff' });
                        clearAttempts();
                    } else {
                        throw signInErr;
                    }
                }
            } catch (err) {
                console.error('Auth error:', err.code || err);
                const attempts = registerFailedAttempt();
                if (getLockRemainingMs() > 0) {
                    startLockCountdown();
                } else {
                    showLoginError(`Невірний ID або PIN (спроба ${attempts}/${MAX_ATTEMPTS})`);
                    btn.disabled = false;
                    btn.innerText = 'Увійти';
                }
            }
        }

        // Единая точка правды о статусе входа — реагирует на настоящую сессию Firebase Auth
        onAuthStateChanged(auth, async (user) => {
            const btn = document.getElementById('login-btn');
            if (user) {
                let name = '';
                isAdmin = false;
                try {
                    const empSnap = await getDoc(doc(employeesCollection, user.uid));
                    if (empSnap.exists()) {
                        name = empSnap.data().name || '';
                        isAdmin = empSnap.data().role === 'admin';
                    }
                } catch (e) { console.error('Employee lookup error:', e); }
                currentUserName = name;
                document.getElementById('add-emp-nav-btn').style.display = isAdmin ? 'inline-block' : 'none';
                showApp(name);
                subscribeToRecords();
                subscribeToTechItems();
                subscribeToActivity();
                showDashboard();
            } else {
                showLoginScreen();
                unsubscribeFromRecords();
                unsubscribeFromTechItems();
                unsubscribeFromActivity();
                currentUserName = '';
                isAdmin = false;
            }
            btn.disabled = false;
            btn.innerText = 'Увійти';
        });

        if (getLockRemainingMs() > 0) {
            startLockCountdown();
        }

        document.getElementById('login-btn').addEventListener('click', attemptLogin);
        document.getElementById('login-pin').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });
        document.getElementById('login-id').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('login-pin').focus();
        });
        document.getElementById('login-toggle-pin').addEventListener('click', () => {
            const pinInput = document.getElementById('login-pin');
            const btn = document.getElementById('login-toggle-pin');
            if (pinInput.type === 'password') {
                pinInput.type = 'text';
                btn.innerText = 'Скрыть';
            } else {
                pinInput.type = 'password';
                btn.innerText = 'Показать';
            }
        });

        // ===== Добавление сотрудника (используем отдельный вторичный экземпляр Firebase,
        // чтобы создание нового аккаунта не выбивало из системы текущего вошедшего) =====
        async function addEmployee() {
            if (!isAdmin) {
                document.getElementById('add-emp-error').innerText = 'Только администратор может добавлять сотрудников';
                return;
            }

            const newId = document.getElementById('new-emp-id').value.trim();
            const newPin = document.getElementById('new-emp-pin').value.trim();
            const newName = document.getElementById('new-emp-name').value.trim();
            const errorEl = document.getElementById('add-emp-error');
            const btn = document.getElementById('add-emp-btn');
            errorEl.innerText = '';

            if (!newId || !newPin || !newName) {
                errorEl.innerText = 'Заполните все поля';
                return;
            }
            if (newPin.length < 6) {
                errorEl.innerText = 'PIN должен быть не короче 6 цифр';
                return;
            }

            btn.disabled = true;
            btn.innerText = '...';

            const secondaryApp = initializeApp(firebaseConfig, 'secondary-' + Date.now());
            const secondaryAuth = getAuth(secondaryApp);
            const secondaryDb = getFirestore(secondaryApp);

            try {
                const cred = await createUserWithEmailAndPassword(secondaryAuth, idToEmail(newId), pinToPassword(newPin));
                // Пишем через secondaryDb, т.к. правила разрешают сотруднику создавать только свою запись —
                // а через основной db запрос ушёл бы от имени администратора, а не нового сотрудника.
                // Роль всегда "staff" при самостоятельном создании — так требуют правила безопасности,
                // повысить до администратора можно только вручную через консоль Firebase.
                await setDoc(doc(collection(secondaryDb, 'employees'), cred.user.uid), { id: newId, name: newName, role: 'staff' });
                await signOut(secondaryAuth);
                await deleteApp(secondaryApp);
                logActivity('employee', `Добавлен сотрудник: ${newName} (ID ${newId})`);
                closeAddEmployeeModal();
                document.getElementById('new-emp-id').value = '';
                document.getElementById('new-emp-pin').value = '';
                document.getElementById('new-emp-name').value = '';
            } catch (err) {
                console.error('Add employee error:', err);
                if (err.code === 'auth/email-already-in-use') {
                    errorEl.innerText = 'Сотрудник с таким ID уже существует';
                } else if (err.code === 'auth/weak-password') {
                    errorEl.innerText = 'PIN слишком короткий (нужно от 6 символов)';
                } else {
                    errorEl.innerText = 'Ошибка при добавлении';
                }
                try { await deleteApp(secondaryApp); } catch (e) {}
            } finally {
                btn.disabled = false;
                btn.innerText = 'Добавить';
            }
        }

        function openAddEmployeeModal() {
            document.getElementById('add-emp-error').innerText = '';
            document.getElementById('add-employee-overlay').classList.add('open');
        }
        function closeAddEmployeeModal() {
            document.getElementById('add-employee-overlay').classList.remove('open');
        }

        let records = [];
        let currentLang = 'ru';
        let editingId = null;

        const translations = {
            ru: {
                search: "Поиск инструмента...",

        function t() { return translations[currentLang]; }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            const tr = t();
            document.getElementById('search-input').placeholder = tr.search;
            document.getElementById('btn-add').innerText = tr.addBtn;
            document.getElementById('th-id').innerText = tr.thId;
            document.getElementById('th-name').innerText = tr.thName;
            document.getElementById('th-employee').innerText = tr.thEmployee;
            document.getElementById('th-status').innerText = tr.thStatus;
            document.getElementById('th-date').innerText = tr.thDate;
            document.getElementById('lbl-name').innerText = tr.lblName;
            document.getElementById('lbl-employee').innerText = tr.lblEmployee;
            document.getElementById('lbl-status').innerText = tr.lblStatus;
            document.getElementById('btn-cancel').innerText = tr.btnCancel;
            document.getElementById('btn-save').innerText = tr.btnSave;
            document.getElementById('field-name').placeholder = tr.namePlaceholder;
            document.getElementById('field-employee').placeholder = tr.employeePlaceholder;

            const statusSelect = document.getElementById('field-status');
            statusSelect.innerHTML = `
                <option value="kletka">${tr.statuses.kletka}</option>
                <option value="issued">${tr.statuses.issued}</option>
                <option value="broken">${tr.statuses.broken}</option>
            `;

            renderTable();
        }

        function formatDate(d) {
            const dt = new Date(d);
            const dd = String(dt.getDate()).padStart(2, '0');
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const yyyy = dt.getFullYear();
            return `${dd}.${mm}.${yyyy}`;
        }

        // Живая подписка на изменения — запускается только после подтверждённого входа,
        // так как правила Firestore теперь требуют аутентификацию
        let unsubscribeRecords = null;
        function subscribeToRecords() {
            if (unsubscribeRecords) return; // уже подписаны
            unsubscribeRecords = onSnapshot(recordsCollection, (snapshot) => {
                records = snapshot.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
                records.sort((a, b) => (a.seq || 0) - (b.seq || 0));
                renderTable();
                renderDashboard();
            }, (err) => {
                console.error('Firestore error:', err);
                const tbody = document.getElementById('inventory-list');
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Ошибка подключения к базе данных. Проверьте интернет и правила безопасности Firestore.</td></tr>`;
            });
        }
        function unsubscribeFromRecords() {
            if (unsubscribeRecords) {
                unsubscribeRecords();
                unsubscribeRecords = null;
            }
            records = [];
        }

        // ===== Техника (категории вроде "Мониторы") =====
        let unsubscribeTechItems = null;
        function subscribeToTechItems() {
            if (unsubscribeTechItems) return;
            unsubscribeTechItems = onSnapshot(techItemsCollection, (snapshot) => {
                techItems = snapshot.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
                techItems.sort((a, b) => (a.seq || 0) - (b.seq || 0));
                if (currentTechCategory) renderTechTable();
                renderDashboard();
            }, (err) => {
                console.error('Firestore error:', err);
                const tbody = document.getElementById('tech-items-list');
                if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Ошибка подключения к базе данных. Проверьте правила безопасности Firestore.</td></tr>`;
            });
        }
        function unsubscribeFromTechItems() {
            if (unsubscribeTechItems) {
                unsubscribeTechItems();
                unsubscribeTechItems = null;
            }
            techItems = [];
        }

        function nextTechDisplayId(categoryKey) {
            const cat = TECH_CATEGORIES.find(c => c.key === categoryKey);
            const prefix = cat ? cat.prefix : 'ITEM';
            const catItems = techItems.filter(i => i.category === categoryKey);
            const maxNum = catItems.reduce((max, i) => {
                const num = parseInt(String(i.displayId || '').replace(prefix + '-', ''), 10);
                return isNaN(num) ? max : Math.max(max, num);
            }, 0);
            return `${prefix}-${String(maxNum + 1).padStart(3, '0')}`;
        }
        function nextTechSeq() { return techItems.reduce((max, i) => Math.max(max, i.seq || 0), 0) + 1; }

        function renderTechTable() {
            const tbody = document.getElementById('tech-items-list');
            const q = document.getElementById('tech-search-input').value.trim().toLowerCase();
            let filtered = techItems.filter(i => i.category === currentTechCategory);

            if (q) {
                filtered = filtered.filter(i =>
                    (i.name || '').toLowerCase().includes(q) ||
                    (i.serial || '').toLowerCase().includes(q) ||
                    (i.assetCode || '').toLowerCase().includes(q) ||
                    (i.displayId || '').toLowerCase().includes(q)
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">${q ? 'Ничего не найдено' : 'Пока нет записей в этой категории'}</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(i => `
                <tr>
                    <td>${escapeHtml(i.displayId || '')}</td>
                    <td>${escapeHtml(i.name || '')}</td>
                    <td>${escapeHtml(i.serial || '')}</td>
                    <td>
                        <select class="status-badge status-${i.status}" onchange="window.changeTechStatus('${i.firestoreId}', this.value)">
                            <option value="kletka" ${i.status === 'kletka' ? 'selected' : ''}>В наличии</option>
                            <option value="issued" ${i.status === 'issued' ? 'selected' : ''}>Выдано</option>
                            <option value="broken" ${i.status === 'broken' ? 'selected' : ''}>Неисправно</option>
                        </select>
                    </td>
                    <td>${formatDate(i.date)}</td>
                    <td class="actions-cell">
                        <button class="btn btn-secondary btn-icon" onclick="window.openEditTechModal('${i.firestoreId}')">Изм.</button>
                        <button class="btn btn-danger btn-icon" onclick="window.deleteTechItem('${i.firestoreId}')">Удал.</button>
                    </td>
                </tr>
            `).join('');
        }

        function openAddTechModal() {
            editingTechId = null;
            document.getElementById('tech-modal-title').innerText = `Добавить: ${techCategoryLabel(currentTechCategory)}`;
            document.getElementById('tech-field-name').value = '';
            document.getElementById('tech-field-serial').value = '';
            document.getElementById('tech-field-asset').value = '';
            document.getElementById('tech-field-status').value = 'kletka';
            document.getElementById('tech-save-indicator').innerText = '';
            document.getElementById('tech-modal-overlay').classList.add('open');
        }
        function openEditTechModal(id) {
            const item = techItems.find(i => i.firestoreId === id);
            if (!item) return;
            editingTechId = id;
            document.getElementById('tech-modal-title').innerText = `Изменить: ${techCategoryLabel(currentTechCategory)}`;
            document.getElementById('tech-field-name').value = item.name || '';
            document.getElementById('tech-field-serial').value = item.serial || '';
            document.getElementById('tech-field-asset').value = item.assetCode || '';
            document.getElementById('tech-field-status').value = item.status || 'kletka';
            document.getElementById('tech-save-indicator').innerText = '';
            document.getElementById('tech-modal-overlay').classList.add('open');
        }
        function closeTechModal() { document.getElementById('tech-modal-overlay').classList.remove('open'); }

        async function saveTechItem() {
            const name = document.getElementById('tech-field-name').value.trim();
            const serial = document.getElementById('tech-field-serial').value.trim();
            const assetCode = document.getElementById('tech-field-asset').value.trim();
            const status = document.getElementById('tech-field-status').value;
            const indicator = document.getElementById('tech-save-indicator');

            if (!name) { indicator.innerText = 'Заполните название/модель'; return; }

            indicator.innerText = '...';
            try {
                if (editingTechId) {
                    await updateDoc(doc(db, 'tech_items', editingTechId), { name, serial, assetCode, status });
                    logActivity('edit', `Изменена запись (${techCategoryLabel(currentTechCategory)}): ${name}`);
                } else {
                    await addDoc(techItemsCollection, {
                        category: currentTechCategory,
                        displayId: nextTechDisplayId(currentTechCategory),
                        seq: nextTechSeq(),
                        name, serial, assetCode, status,
                        date: new Date().toISOString()
                    });
                    logActivity('add', `Добавлена запись (${techCategoryLabel(currentTechCategory)}): ${name}`);
                }
                indicator.innerText = 'Сохранено';
                closeTechModal();
            } catch (err) {
                console.error('Firestore error:', err);
                indicator.innerText = 'Ошибка сохранения';
            }
        }

        async function changeTechStatus(id, newStatus) {
            try {
                const item = techItems.find(i => i.firestoreId === id);
                await updateDoc(doc(db, 'tech_items', id), { status: newStatus });
                if (item) {
                    const labels = { kletka: 'В наличии', issued: 'Выдано', broken: 'Неисправно' };
                    logActivity('status', `Статус "${item.name}" изменён на "${labels[newStatus] || newStatus}"`);
                }
            } catch (err) { console.error('Firestore error:', err); alert('Ошибка сохранения'); }
        }

        async function deleteTechItem(id) {
            if (!confirm('Удалить эту запись?')) return;
            try {
                const item = techItems.find(i => i.firestoreId === id);
                await deleteDoc(doc(db, 'tech_items', id));
                if (item) logActivity('delete', `Удалена запись (${techCategoryLabel(currentTechCategory)}): ${item.name}`);
            } catch (err) { console.error('Firestore error:', err); alert('Ошибка сохранения'); }
        }

        document.getElementById('tech-modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'tech-modal-overlay') closeTechModal();
        });

        // Журнал действий (история)
        let unsubscribeActivity = null;
        function subscribeToActivity() {
            if (unsubscribeActivity) return;
            const q = query(activityCollection, orderBy('timestamp', 'desc'), limit(50));
            unsubscribeActivity = onSnapshot(q, (snapshot) => {
                const list = document.getElementById('history-list');
                if (!list) return;
                if (snapshot.empty) {
                    list.innerHTML = `<div class="empty-state">Пока нет действий</div>`;
                    return;
                }
                list.innerHTML = snapshot.docs.map(d => {
                    const data = d.data();
                    const dt = new Date(data.timestamp);
                    const timeStr = dt.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    return `
                        <div class="history-item">
                            <div class="history-message">${escapeHtml(data.message || '')}</div>
                            <div class="history-meta">${escapeHtml(data.actor || '')} · ${timeStr}</div>
                        </div>
                    `;
                }).join('');
            }, (err) => {
                console.error('Activity error:', err);
            });
        }
        function unsubscribeFromActivity() {
            if (unsubscribeActivity) {
                unsubscribeActivity();
                unsubscribeActivity = null;
            }
        }

        function openHistoryModal() {
            document.getElementById('history-overlay').classList.add('open');
        }
        function closeHistoryModal() {
            document.getElementById('history-overlay').classList.remove('open');
        }

        function nextDisplayId() {
            const maxNum = records.reduce((max, r) => {
                const num = parseInt(String(r.displayId || '').replace('#', ''), 10);
                return isNaN(num) ? max : Math.max(max, num);
            }, 0);
            return '#' + String(maxNum + 1).padStart(3, '0');
        }

        function nextSeq() {
            return records.reduce((max, r) => Math.max(max, r.seq || 0), 0) + 1;
        }

        function renderTable() {
            const tbody = document.getElementById('inventory-list');
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const tr = t();

            let filtered = records;
            if (query) {
                filtered = records.filter(r =>
                    r.name.toLowerCase().includes(query) ||
                    r.employee.toLowerCase().includes(query) ||
                    String(r.displayId).toLowerCase().includes(query)
                );
            }

            document.getElementById('record-count').innerText = tr.recordCount(records.length);

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">${tr.emptyState}</td></tr>`;
                return;
            }
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">${tr.noResults}</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(r => `
                <tr>
                    <td>${escapeHtml(r.displayId)}</td>
                    <td>${escapeHtml(r.name)}</td>
                    <td>${escapeHtml(r.employee)}</td>
                    <td>
                        <select class="status-badge status-${r.status}" onchange="window.changeStatus('${r.firestoreId}', this.value)">
                            <option value="kletka" ${r.status === 'kletka' ? 'selected' : ''}>${tr.statuses.kletka}</option>
                            <option value="issued" ${r.status === 'issued' ? 'selected' : ''}>${tr.statuses.issued}</option>
                            <option value="broken" ${r.status === 'broken' ? 'selected' : ''}>${tr.statuses.broken}</option>
                        </select>
                    </td>
                    <td>${formatDate(r.date)}</td>
                    <td class="actions-cell">
                        <button class="btn btn-secondary btn-icon" onclick="window.openEditModal('${r.firestoreId}')">${tr.editBtn}</button>
                        <button class="btn btn-danger btn-icon" onclick="window.deleteRecord('${r.firestoreId}')">${tr.deleteBtn}</button>
                    </td>
                </tr>
            `).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('modal-title').innerText = t().modalTitleAdd;
            document.getElementById('field-name').value = '';
            document.getElementById('field-employee').value = '';
            document.getElementById('field-status').value = 'kletka';
            document.getElementById('save-indicator').innerText = '';
            document.getElementById('modal-overlay').classList.add('open');
        }

        function openEditModal(id) {
            const record = records.find(r => r.firestoreId === id);
            if (!record) return;
            editingId = id;
            document.getElementById('modal-title').innerText = t().modalTitleEdit;
            document.getElementById('field-name').value = record.name;
            document.getElementById('field-employee').value = record.employee;
            document.getElementById('field-status').value = record.status;
            document.getElementById('save-indicator').innerText = '';
            document.getElementById('modal-overlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('open');
        }

        async function saveRecord() {
            const name = document.getElementById('field-name').value.trim();
            const employee = document.getElementById('field-employee').value.trim();
            const status = document.getElementById('field-status').value;
            const indicator = document.getElementById('save-indicator');

            if (!name || !employee) {
                indicator.innerText = t().validationErr;
                return;
            }

            indicator.innerText = '...';
            try {
                if (editingId) {
                    await updateDoc(doc(db, 'records', editingId), { name, employee, status });
                    logActivity('edit', `Изменена запись: ${name} (сотрудник: ${employee})`);
                } else {
                    await addDoc(recordsCollection, {
                        displayId: nextDisplayId(),
                        seq: nextSeq(),
                        name, employee, status,
                        date: new Date().toISOString()
                    });
                    logActivity('add', `Добавлена запись: ${name} (сотрудник: ${employee})`);
                }
                indicator.innerText = t().savedOk;
                closeModal();
            } catch (err) {
                console.error('Firestore error:', err);
                indicator.innerText = t().savedErr;
            }
        }

        async function changeStatus(id, newStatus) {
            try {
                const record = records.find(r => r.firestoreId === id);
                await updateDoc(doc(db, 'records', id), { status: newStatus });
                if (record) {
                    const statusLabels = { kletka: 'В клетке', issued: 'Выдано', broken: 'Неисправно' };
                    logActivity('status', `Статус "${record.name}" изменён на "${statusLabels[newStatus] || newStatus}"`);
                }
            } catch (err) {
                console.error('Firestore error:', err);
                alert(t().savedErr);
            }
        }

        async function deleteRecord(id) {
            if (!confirm(t().confirmDelete)) return;
            try {
                const record = records.find(r => r.firestoreId === id);
                await deleteDoc(doc(db, 'records', id));
                if (record) logActivity('delete', `Удалена запись: ${record.name}`);
            } catch (err) {
                console.error('Firestore error:', err);
                alert(t().savedErr);
            }
        }

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        });

        async function logout() {
            try {
                await signOut(auth);
            } catch (err) {
                console.error('Logout error:', err);
            }
            document.getElementById('login-id').value = '';
            document.getElementById('login-pin').value = '';
            // showLoginScreen() вызовется автоматически через onAuthStateChanged
        }

        // Делаем функции доступными для onclick в разметке (модульный скрипт изолирован от глобальной области)
        window.setLanguage = setLanguage;
        window.openAddModal = openAddModal;
        window.openEditModal = openEditModal;
        window.closeModal = closeModal;
        window.saveRecord = saveRecord;
        window.changeStatus = changeStatus;
        window.deleteRecord = deleteRecord;
        window.renderTable = renderTable;
        window.logout = logout;
        window.addEmployee = addEmployee;
        window.openAddEmployeeModal = openAddEmployeeModal;
        window.closeAddEmployeeModal = closeAddEmployeeModal;
        window.openHistoryModal = openHistoryModal;
        window.closeHistoryModal = closeHistoryModal;
        window.showDashboard = showDashboard;
        window.openToolsView = openToolsView;
        window.openTechCategory = openTechCategory;
        window.openAddTechModal = openAddTechModal;
        window.openEditTechModal = openEditTechModal;
        window.closeTechModal = closeTechModal;
        window.saveTechItem = saveTechItem;
        window.changeTechStatus = changeTechStatus;
        window.deleteTechItem = deleteTechItem;
    </script>
</body>
</html>
