<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kletka Online</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --status-kletka: #3b82f6;
            --status-issued: #eab308;
            --status-broken: #ef4444;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --emerald: #10b981;
            --emerald-dark: #059669;
            --emerald-light: #34d399;
        }

        /* ===== Экран входа (glassmorphism, стиль Apple) ===== */
        .login-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.25), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(5, 150, 105, 0.3), transparent 50%),
                linear-gradient(160deg, #04140f 0%, #071c16 40%, #0a1f1a 100%);
            overflow: hidden;
        }

        .login-screen.hidden { display: none; }

        .login-screen::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.18), transparent 70%);
            top: -200px;
            left: -150px;
            filter: blur(10px);
            pointer-events: none;
        }

        .login-screen::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15), transparent 70%);
            bottom: -180px;
            right: -120px;
            filter: blur(10px);
            pointer-events: none;
        }

        .login-card {
            position: relative;
            width: 380px;
            max-width: 100%;
            padding: 40px 32px 32px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            text-align: center;
        }

        .login-title {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--emerald-light), var(--emerald));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-logo {
            display: block;
            width: 100%;
            max-width: 220px;
            height: auto;
            margin: 2px auto 22px;
            filter: drop-shadow(0 4px 14px rgba(16, 185, 129, 0.35));
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        .login-subtitle {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .login-hint {
            font-size: 12px;
            color: rgba(226, 232, 240, 0.55);
            margin-bottom: 26px;
        }

        .login-field {
            text-align: left;
            margin-bottom: 16px;
        }

        .login-field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: rgba(226, 232, 240, 0.6);
            margin-bottom: 6px;
        }

        .login-input-wrap {
            position: relative;
        }

        .login-field input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            padding: 13px 14px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            letter-spacing: 1px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .login-field input:focus {
            border-color: var(--emerald);
            background: rgba(255, 255, 255, 0.09);
        }

        .login-field input::placeholder {
            letter-spacing: normal;
            color: rgba(226, 232, 240, 0.35);
        }

        .login-toggle-pin {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(226, 232, 240, 0.5);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 6px;
        }
        .login-toggle-pin:hover { color: var(--emerald-light); }

        .login-btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #052e21;
            cursor: pointer;
            background: linear-gradient(135deg, var(--emerald-light), var(--emerald-dark));
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(16, 185, 129, 0.45); }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled { opacity: 0.6; cursor: default; transform: none; }

        .login-remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 2px 2px;
            font-size: 12px;
            color: rgba(226, 232, 240, 0.6);
        }
        .login-remember input { accent-color: var(--emerald); width: 14px; height: 14px; }

        .login-error {
            min-height: 18px;
            margin-top: 14px;
            font-size: 12px;
            color: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand .sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .lang-switcher {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--accent-color);
            color: #ffffff;
        }

        .lang-btn:hover:not(.active) {
            color: var(--text-main);
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-input {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text-main);
            width: 300px;
            max-width: 100%;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s ease;
        }

        .btn-add {
            background: var(--accent-color);
            color: white;
        }
        .btn-add:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover { border-color: var(--text-muted); }

        .btn-danger {
            background: transparent;
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

        .btn-icon {
            padding: 6px 10px;
            font-size: 13px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .status-kletka { background: rgba(59, 130, 246, 0.15); color: var(--status-kletka); }
        .status-issued { background: rgba(234, 179, 8, 0.15); color: var(--status-issued); }
        .status-broken { background: rgba(239, 68, 68, 0.15); color: var(--status-broken); }

        select.status-badge option {
            background: var(--card-bg);
            color: var(--text-main);
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 400px;
            max-width: 90vw;
        }

        .modal h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field input, .field select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .field input:focus, .field select:focus {
            border-color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .save-indicator {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            min-height: 16px;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div class="login-screen" id="login-screen">
        <div class="login-card">
            <div class="login-title">DC3</div>
            <img class="login-logo" src="logo.png" alt="Kletka Online" draggable="false" oncontextmenu="return false;">
            <div class="login-hint">ID та PIN-код (4–6 цифр)</div>

            <div class="login-field">
                <label>ID</label>
                <input type="text" id="login-id" inputmode="numeric" autocomplete="username" placeholder="Введите ID" maxlength="12">
            </div>
            <div class="login-field">
                <label>PIN</label>
                <div class="login-input-wrap">
                    <input type="password" id="login-pin" inputmode="numeric" autocomplete="current-password" placeholder="••••" maxlength="6">
                    <button type="button" class="login-toggle-pin" id="login-toggle-pin">Показать</button>
                </div>
            </div>

            <label class="login-remember">
                <input type="checkbox" id="login-remember" checked>
                Запомнить меня на этом устройстве
            </label>

            <button class="login-btn" id="login-btn">Увійти</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>

    <div id="app-content" style="display:none; padding: 24px;">

    <header class="header">
        <div class="brand">
            <h1>Kletka Online</h1>
            <div class="sub" id="record-count"></div>
        </div>
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="ru" onclick="setLanguage('ru')">RU</button>
            <button class="lang-btn" data-lang="uk" onclick="setLanguage('uk')">UA</button>
            <button class="lang-btn" data-lang="pl" onclick="setLanguage('pl')">PL</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
        </div>
        <button class="btn btn-secondary btn-icon" onclick="window.openAddEmployeeModal()" style="margin-left:8px;">+ Сотрудник</button>
        <button class="btn btn-secondary btn-icon" onclick="window.logout()" style="margin-left:8px;" id="logout-btn">
            <span id="current-user-name"></span> Выйти
        </button>
    </header>

    <div class="controls-bar">
        <input type="text" class="search-input" id="search-input" placeholder="Поиск инструмента..." oninput="renderTable()">
        <button class="btn btn-add" id="btn-add" onclick="openAddModal()">+ Добавить запись</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th id="th-id">ID</th>
                    <th id="th-name">Наименование</th>
                    <th id="th-employee">Сотрудник</th>
                    <th id="th-status">Статус</th>
                    <th id="th-date">Дата записи</th>
                    <th id="th-actions"></th>
                </tr>
            </thead>
            <tbody id="inventory-list">
                <tr><td colspan="6" class="loading" id="loading-row">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal for add/edit -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">Добавить запись</h2>
            <div class="field">
                <label id="lbl-name">Наименование</label>
                <input type="text" id="field-name" placeholder="Например: Перфоратор Bosch GBH 2-26">
            </div>
            <div class="field">
                <label id="lbl-employee">Сотрудник</label>
                <input type="text" id="field-employee" placeholder="ФИО сотрудника">
            </div>
            <div class="field">
                <label id="lbl-status">Статус</label>
                <select id="field-status">
                    <option value="kletka">В клетке</option>
                    <option value="issued">Выдано</option>
                    <option value="broken">Неисправно</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()" id="btn-cancel">Отмена</button>
                <button class="btn btn-add" onclick="saveRecord()" id="btn-save">Сохранить</button>
            </div>
            <div class="save-indicator" id="save-indicator"></div>
        </div>
    </div>

    <!-- Modal for adding employee -->
    <div class="modal-overlay" id="add-employee-overlay">
        <div class="modal">
            <h2>Добавить сотрудника</h2>
            <div class="field">
                <label>ID (логин)</label>
                <input type="text" id="new-emp-id" inputmode="numeric" placeholder="Например: 60127940" maxlength="12">
            </div>
            <div class="field">
                <label>PIN</label>
                <input type="text" id="new-emp-pin" inputmode="numeric" placeholder="4-6 цифр" maxlength="6">
            </div>
            <div class="field">
                <label>Имя сотрудника</label>
                <input type="text" id="new-emp-name" placeholder="Например: Иван Иванов">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="window.closeAddEmployeeModal()">Отмена</button>
                <button class="btn btn-add" onclick="window.addEmployee()" id="add-emp-btn">Добавить</button>
            </div>
            <div class="save-indicator" id="add-emp-error" style="color:#fca5a5;"></div>
        </div>
    </div>

    </div><!-- /app-content -->

    <script type="module">
        import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getFirestore, collection, onSnapshot,
            addDoc, updateDoc, deleteDoc, doc, getDoc, setDoc
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import {
            getAuth, onAuthStateChanged, signInWithEmailAndPassword,
            createUserWithEmailAndPassword, signOut,
            setPersistence, browserLocalPersistence, browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuBuZSiOi7A_Y7aMhXz2_MEVo48fOlu08",
            authDomain: "kletka-online.firebaseapp.com",
            projectId: "kletka-online",
            storageBucket: "kletka-online.firebasestorage.app",
            messagingSenderId: "641272379713",
            appId: "1:641272379713:web:34074267d0708ff80809c0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const recordsCollection = collection(db, 'records');
        const employeesCollection = collection(db, 'employees');

        // ID/PIN превращаем в email/пароль для настоящей Firebase-авторизации —
        // человек по-прежнему вводит только ID и PIN, а под капотом это полноценный аккаунт
        function idToEmail(id) { return `${id}@kletka-online.app`; }
        function pinToPassword(pin) { return `klt-${pin}-secure`; }

        const BOOTSTRAP_ID = '60127939';
        const BOOTSTRAP_PIN = '6242';
        const BOOTSTRAP_NAME = 'Александр';

        // ===== Экран входа =====
        const ATTEMPTS_KEY = 'kletka_login_attempts';
        const LOCK_UNTIL_KEY = 'kletka_login_lock_until';
        const MAX_ATTEMPTS = 5;
        const LOCK_DURATION_MS = 60 * 1000; // 1 минута блокировки после превышения попыток

        function showApp(userName) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('current-user-name').innerText = userName ? userName + ' —' : '';
        }

        function showLoginScreen() {
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function showLoginError(msg) {
            document.getElementById('login-error').innerText = msg;
        }

        function getLockRemainingMs() {
            const lockUntil = parseInt(localStorage.getItem(LOCK_UNTIL_KEY) || '0', 10);
            return Math.max(0, lockUntil - Date.now());
        }

        function registerFailedAttempt() {
            const attempts = parseInt(localStorage.getItem(ATTEMPTS_KEY) || '0', 10) + 1;
            localStorage.setItem(ATTEMPTS_KEY, String(attempts));
            if (attempts >= MAX_ATTEMPTS) {
                localStorage.setItem(LOCK_UNTIL_KEY, String(Date.now() + LOCK_DURATION_MS));
                localStorage.setItem(ATTEMPTS_KEY, '0');
            }
            return attempts;
        }

        function clearAttempts() {
            localStorage.removeItem(ATTEMPTS_KEY);
            localStorage.removeItem(LOCK_UNTIL_KEY);
        }

        let lockTimerInterval = null;
        function startLockCountdown() {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            if (lockTimerInterval) clearInterval(lockTimerInterval);
            lockTimerInterval = setInterval(() => {
                const remaining = getLockRemainingMs();
                if (remaining <= 0) {
                    clearInterval(lockTimerInterval);
                    btn.disabled = false;
                    btn.innerText = 'Увійти';
                    showLoginError('');
                } else {
                    const seconds = Math.ceil(remaining / 1000);
                    showLoginError(`Занадто багато спроб. Спробуйте через ${seconds} с.`);
                    btn.innerText = `Заблоковано (${seconds}с)`;
                }
            }, 500);
        }

        async function attemptLogin() {
            const remainingLock = getLockRemainingMs();
            if (remainingLock > 0) {
                startLockCountdown();
                return;
            }

            const idVal = document.getElementById('login-id').value.trim();
            const pinVal = document.getElementById('login-pin').value.trim();
            const btn = document.getElementById('login-btn');
            const remember = document.getElementById('login-remember').checked;

            if (!idVal || !pinVal) {
                showLoginError('Введіть ID та PIN');
                return;
            }

            btn.disabled = true;
            btn.innerText = '...';
            showLoginError('');

            try {
                await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);

                try {
                    await signInWithEmailAndPassword(auth, idToEmail(idVal), pinToPassword(pinVal));
                    clearAttempts();
                    // onAuthStateChanged сам покажет приложение и подтянет имя
                } catch (signInErr) {
                    const isMissingUser = signInErr.code === 'auth/user-not-found' || signInErr.code === 'auth/invalid-credential';
                    if (isMissingUser && idVal === BOOTSTRAP_ID && pinVal === BOOTSTRAP_PIN) {
                        // Самый первый запуск — создаём главный аккаунт-администратор
                        const cred = await createUserWithEmailAndPassword(auth, idToEmail(idVal), pinToPassword(pinVal));
                        await setDoc(doc(employeesCollection, cred.user.uid), { id: idVal, name: BOOTSTRAP_NAME });
                        clearAttempts();
                    } else {
                        throw signInErr;
                    }
                }
            } catch (err) {
                console.error('Auth error:', err.code || err);
                const attempts = registerFailedAttempt();
                if (getLockRemainingMs() > 0) {
                    startLockCountdown();
                } else {
                    showLoginError(`Невірний ID або PIN (спроба ${attempts}/${MAX_ATTEMPTS})`);
                    btn.disabled = false;
                    btn.innerText = 'Увійти';
                }
            }
        }

        // Единая точка правды о статусе входа — реагирует на настоящую сессию Firebase Auth
        onAuthStateChanged(auth, async (user) => {
            const btn = document.getElementById('login-btn');
            if (user) {
                let name = '';
                try {
                    const empSnap = await getDoc(doc(employeesCollection, user.uid));
                    if (empSnap.exists()) name = empSnap.data().name || '';
                } catch (e) { console.error('Employee lookup error:', e); }
                showApp(name);
            } else {
                showLoginScreen();
            }
            btn.disabled = false;
            btn.innerText = 'Увійти';
        });

        if (getLockRemainingMs() > 0) {
            startLockCountdown();
        }

        document.getElementById('login-btn').addEventListener('click', attemptLogin);
        document.getElementById('login-pin').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });
        document.getElementById('login-id').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('login-pin').focus();
        });
        document.getElementById('login-toggle-pin').addEventListener('click', () => {
            const pinInput = document.getElementById('login-pin');
            const btn = document.getElementById('login-toggle-pin');
            if (pinInput.type === 'password') {
                pinInput.type = 'text';
                btn.innerText = 'Скрыть';
            } else {
                pinInput.type = 'password';
                btn.innerText = 'Показать';
            }
        });

        // ===== Добавление сотрудника (используем отдельный вторичный экземпляр Firebase,
        // чтобы создание нового аккаунта не выбивало из системы текущего вошедшего) =====
        async function addEmployee() {
            const newId = document.getElementById('new-emp-id').value.trim();
            const newPin = document.getElementById('new-emp-pin').value.trim();
            const newName = document.getElementById('new-emp-name').value.trim();
            const errorEl = document.getElementById('add-emp-error');
            const btn = document.getElementById('add-emp-btn');
            errorEl.innerText = '';

            if (!newId || !newPin || !newName) {
                errorEl.innerText = 'Заполните все поля';
                return;
            }
            if (newPin.length < 4) {
                errorEl.innerText = 'PIN должен быть не короче 4 цифр';
                return;
            }

            btn.disabled = true;
            btn.innerText = '...';

            const secondaryApp = initializeApp(firebaseConfig, 'secondary-' + Date.now());
            const secondaryAuth = getAuth(secondaryApp);

            try {
                const cred = await createUserWithEmailAndPassword(secondaryAuth, idToEmail(newId), pinToPassword(newPin));
                await setDoc(doc(collection(db, 'employees'), cred.user.uid), { id: newId, name: newName });
                await signOut(secondaryAuth);
                await deleteApp(secondaryApp);
                closeAddEmployeeModal();
                document.getElementById('new-emp-id').value = '';
                document.getElementById('new-emp-pin').value = '';
                document.getElementById('new-emp-name').value = '';
            } catch (err) {
                console.error('Add employee error:', err);
                if (err.code === 'auth/email-already-in-use') {
                    errorEl.innerText = 'Сотрудник с таким ID уже существует';
                } else if (err.code === 'auth/weak-password') {
                    errorEl.innerText = 'PIN слишком короткий (нужно от 6 символов)';
                } else {
                    errorEl.innerText = 'Ошибка при добавлении';
                }
                try { await deleteApp(secondaryApp); } catch (e) {}
            } finally {
                btn.disabled = false;
                btn.innerText = 'Добавить';
            }
        }

        function openAddEmployeeModal() {
            document.getElementById('add-emp-error').innerText = '';
            document.getElementById('add-employee-overlay').classList.add('open');
        }
        function closeAddEmployeeModal() {
            document.getElementById('add-employee-overlay').classList.remove('open');
        }

        let records = [];
        let currentLang = 'ru';
        let editingId = null;

        const translations = {
            ru: {
                search: "Поиск инструмента...",
                addBtn: "+ Добавить запись",
                thId: "ID", thName: "Наименование", thEmployee: "Сотрудник",
                thStatus: "Статус", thDate: "Дата записи",
                statuses: { kletka: "В клетке", issued: "Выдано", broken: "Неисправно" },
                modalTitleAdd: "Добавить запись",
                modalTitleEdit: "Редактировать запись",
                lblName: "Наименование", lblEmployee: "Сотрудник", lblStatus: "Статус",
                btnCancel: "Отмена", btnSave: "Сохранить",
                editBtn: "Изм.", deleteBtn: "Удал.",
                confirmDelete: "Удалить эту запись?",
                emptyState: "Записей нет. Добавьте первую.",
                noResults: "Ничего не найдено.",
                recordCount: n => `Всего записей: ${n}`,
                savedOk: "Сохранено",
                savedErr: "Ошибка сохранения",
                namePlaceholder: "Например: Перфоратор Bosch GBH 2-26",
                employeePlaceholder: "ФИО сотрудника",
                validationErr: "Заполните наименование и сотрудника"
            },
            uk: {
                search: "Пошук інструменту...",
                addBtn: "+ Додати запис",
                thId: "ID", thName: "Назва", thEmployee: "Працівник",
                thStatus: "Статус", thDate: "Дата запису",
                statuses: { kletka: "У клітці", issued: "Видано", broken: "Несправно" },
                modalTitleAdd: "Додати запис",
                modalTitleEdit: "Редагувати запис",
                lblName: "Назва", lblEmployee: "Працівник", lblStatus: "Статус",
                btnCancel: "Скасувати", btnSave: "Зберегти",
                editBtn: "Ред.", deleteBtn: "Вид.",
                confirmDelete: "Видалити цей запис?",
                emptyState: "Записів немає. Додайте перший.",
                noResults: "Нічого не знайдено.",
                recordCount: n => `Всього записів: ${n}`,
                savedOk: "Збережено",
                savedErr: "Помилка збереження",
                namePlaceholder: "Наприклад: Перфоратор Bosch GBH 2-26",
                employeePlaceholder: "ПІБ працівника",
                validationErr: "Заповніть назву та працівника"
            },
            pl: {
                search: "Szukaj narzędzia...",
                addBtn: "+ Dodaj wpis",
                thId: "ID", thName: "Nazwa", thEmployee: "Pracownik",
                thStatus: "Status", thDate: "Data wpisu",
                statuses: { kletka: "W klatce", issued: "Wydane", broken: "Uszkodzone" },
                modalTitleAdd: "Dodaj wpis",
                modalTitleEdit: "Edytuj wpis",
                lblName: "Nazwa", lblEmployee: "Pracownik", lblStatus: "Status",
                btnCancel: "Anuluj", btnSave: "Zapisz",
                editBtn: "Edyt.", deleteBtn: "Usuń",
                confirmDelete: "Usunąć ten wpis?",
                emptyState: "Brak wpisów. Dodaj pierwszy.",
                noResults: "Nic nie znaleziono.",
                recordCount: n => `Łącznie wpisów: ${n}`,
                savedOk: "Zapisano",
                savedErr: "Błąd zapisu",
                namePlaceholder: "Np: Wiertarka Bosch GBH 2-26",
                employeePlaceholder: "Imię i nazwisko pracownika",
                validationErr: "Wypełnij nazwę i pracownika"
            },
            en: {
                search: "Search tool...",
                addBtn: "+ Add Record",
                thId: "ID", thName: "Item Name", thEmployee: "Employee",
                thStatus: "Status", thDate: "Record Date",
                statuses: { kletka: "In Cage", issued: "Issued", broken: "Out of order" },
                modalTitleAdd: "Add Record",
                modalTitleEdit: "Edit Record",
                lblName: "Item Name", lblEmployee: "Employee", lblStatus: "Status",
                btnCancel: "Cancel", btnSave: "Save",
                editBtn: "Edit", deleteBtn: "Delete",
                confirmDelete: "Delete this record?",
                emptyState: "No records yet. Add the first one.",
                noResults: "No results found.",
                recordCount: n => `Total records: ${n}`,
                savedOk: "Saved",
                savedErr: "Save error",
                namePlaceholder: "e.g. Bosch GBH 2-26 Hammer Drill",
                employeePlaceholder: "Employee full name",
                validationErr: "Fill in item name and employee"
            }
        };

        function t() { return translations[currentLang]; }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            const tr = t();
            document.getElementById('search-input').placeholder = tr.search;
            document.getElementById('btn-add').innerText = tr.addBtn;
            document.getElementById('th-id').innerText = tr.thId;
            document.getElementById('th-name').innerText = tr.thName;
            document.getElementById('th-employee').innerText = tr.thEmployee;
            document.getElementById('th-status').innerText = tr.thStatus;
            document.getElementById('th-date').innerText = tr.thDate;
            document.getElementById('lbl-name').innerText = tr.lblName;
            document.getElementById('lbl-employee').innerText = tr.lblEmployee;
            document.getElementById('lbl-status').innerText = tr.lblStatus;
            document.getElementById('btn-cancel').innerText = tr.btnCancel;
            document.getElementById('btn-save').innerText = tr.btnSave;
            document.getElementById('field-name').placeholder = tr.namePlaceholder;
            document.getElementById('field-employee').placeholder = tr.employeePlaceholder;

            const statusSelect = document.getElementById('field-status');
            statusSelect.innerHTML = `
                <option value="kletka">${tr.statuses.kletka}</option>
                <option value="issued">${tr.statuses.issued}</option>
                <option value="broken">${tr.statuses.broken}</option>
            `;

            renderTable();
        }

        function formatDate(d) {
            const dt = new Date(d);
            const dd = String(dt.getDate()).padStart(2, '0');
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const yyyy = dt.getFullYear();
            return `${dd}.${mm}.${yyyy}`;
        }

        // Живая подписка на изменения — все, кто открыл страницу, видят обновления сразу
        onSnapshot(recordsCollection, (snapshot) => {
            records = snapshot.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
            records.sort((a, b) => (a.seq || 0) - (b.seq || 0));
            renderTable();
        }, (err) => {
            console.error('Firestore error:', err);
            const tbody = document.getElementById('inventory-list');
            tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Ошибка подключения к базе данных. Проверьте интернет и правила безопасности Firestore.</td></tr>`;
        });

        function nextDisplayId() {
            const maxNum = records.reduce((max, r) => {
                const num = parseInt(String(r.displayId || '').replace('#', ''), 10);
                return isNaN(num) ? max : Math.max(max, num);
            }, 0);
            return '#' + String(maxNum + 1).padStart(3, '0');
        }

        function nextSeq() {
            return records.reduce((max, r) => Math.max(max, r.seq || 0), 0) + 1;
        }

        function renderTable() {
            const tbody = document.getElementById('inventory-list');
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const tr = t();

            let filtered = records;
            if (query) {
                filtered = records.filter(r =>
                    r.name.toLowerCase().includes(query) ||
                    r.employee.toLowerCase().includes(query) ||
                    String(r.displayId).toLowerCase().includes(query)
                );
            }

            document.getElementById('record-count').innerText = tr.recordCount(records.length);

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">${tr.emptyState}</td></tr>`;
                return;
            }
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">${tr.noResults}</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(r => `
                <tr>
                    <td>${escapeHtml(r.displayId)}</td>
                    <td>${escapeHtml(r.name)}</td>
                    <td>${escapeHtml(r.employee)}</td>
                    <td>
                        <select class="status-badge status-${r.status}" onchange="window.changeStatus('${r.firestoreId}', this.value)">
                            <option value="kletka" ${r.status === 'kletka' ? 'selected' : ''}>${tr.statuses.kletka}</option>
                            <option value="issued" ${r.status === 'issued' ? 'selected' : ''}>${tr.statuses.issued}</option>
                            <option value="broken" ${r.status === 'broken' ? 'selected' : ''}>${tr.statuses.broken}</option>
                        </select>
                    </td>
                    <td>${formatDate(r.date)}</td>
                    <td class="actions-cell">
                        <button class="btn btn-secondary btn-icon" onclick="window.openEditModal('${r.firestoreId}')">${tr.editBtn}</button>
                        <button class="btn btn-danger btn-icon" onclick="window.deleteRecord('${r.firestoreId}')">${tr.deleteBtn}</button>
                    </td>
                </tr>
            `).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('modal-title').innerText = t().modalTitleAdd;
            document.getElementById('field-name').value = '';
            document.getElementById('field-employee').value = '';
            document.getElementById('field-status').value = 'kletka';
            document.getElementById('save-indicator').innerText = '';
            document.getElementById('modal-overlay').classList.add('open');
        }

        function openEditModal(id) {
            const record = records.find(r => r.firestoreId === id);
            if (!record) return;
            editingId = id;
            document.getElementById('modal-title').innerText = t().modalTitleEdit;
            document.getElementById('field-name').value = record.name;
            document.getElementById('field-employee').value = record.employee;
            document.getElementById('field-status').value = record.status;
            document.getElementById('save-indicator').innerText = '';
            document.getElementById('modal-overlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('open');
        }

        async function saveRecord() {
            const name = document.getElementById('field-name').value.trim();
            const employee = document.getElementById('field-employee').value.trim();
            const status = document.getElementById('field-status').value;
            const indicator = document.getElementById('save-indicator');

            if (!name || !employee) {
                indicator.innerText = t().validationErr;
                return;
            }

            indicator.innerText = '...';
            try {
                if (editingId) {
                    await updateDoc(doc(db, 'records', editingId), { name, employee, status });
                } else {
                    await addDoc(recordsCollection, {
                        displayId: nextDisplayId(),
                        seq: nextSeq(),
                        name, employee, status,
                        date: new Date().toISOString()
                    });
                }
                indicator.innerText = t().savedOk;
                closeModal();
            } catch (err) {
                console.error('Firestore error:', err);
                indicator.innerText = t().savedErr;
            }
        }

        async function changeStatus(id, newStatus) {
            try {
                await updateDoc(doc(db, 'records', id), { status: newStatus });
            } catch (err) {
                console.error('Firestore error:', err);
                alert(t().savedErr);
            }
        }

        async function deleteRecord(id) {
            if (!confirm(t().confirmDelete)) return;
            try {
                await deleteDoc(doc(db, 'records', id));
            } catch (err) {
                console.error('Firestore error:', err);
                alert(t().savedErr);
            }
        }

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        });

        async function logout() {
            try {
                await signOut(auth);
            } catch (err) {
                console.error('Logout error:', err);
            }
            document.getElementById('login-id').value = '';
            document.getElementById('login-pin').value = '';
            // showLoginScreen() вызовется автоматически через onAuthStateChanged
        }

        // Делаем функции доступными для onclick в разметке (модульный скрипт изолирован от глобальной области)
        window.setLanguage = setLanguage;
        window.openAddModal = openAddModal;
        window.openEditModal = openEditModal;
        window.closeModal = closeModal;
        window.saveRecord = saveRecord;
        window.changeStatus = changeStatus;
        window.deleteRecord = deleteRecord;
        window.renderTable = renderTable;
        window.logout = logout;
        window.addEmployee = addEmployee;
        window.openAddEmployeeModal = openAddEmployeeModal;
        window.closeAddEmployeeModal = closeAddEmployeeModal;
    </script>
</body>
</html>
